# Test-specific configuration
# Dummy values for required environment variables

# Server configuration
BACKEND_PORT=8888

# Database Configuration (use H2 in-memory for faster tests)
DATABASE_URL=jdbc:h2:mem:testdb
DATABASE_USERNAME=sa
DATABASE_PASSWORD=

# Explicit Spring datasource configuration for H2
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Enable H2 console for debugging (optional)
spring.h2.console.enabled=true

# Minio Configuration (dummy values for tests)
MINIO_API_URL=http://localhost:9000
MINIO_USERNAME=minioadmin
MINIO_PASSWORD=minioadmin
MINIO_PROJECT_NAME=test-bucket

# MinIO SDK Configuration (Spring Boot properties)
minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=test-bucket

# Mail Configuration (dummy values for tests)
MAIL_HOST=localhost
MAIL_PORT=1025
MAIL_USERNAME=test@example.com
MAIL_PASSWORD=testpassword
MAIL_PROTOCOL=smtp

# JWT Configuration (dummy values for tests)
application.security.jwt.secret-key=placeholderSecretKeyThatIsVeryLongAndSecure1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000

# API Configuration
api.prefix=api/v1

# File storage configuration
file.storage.location=./minio/uploads

# Disable mail auto-configuration for tests if needed
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

spring.profiles.active=test 